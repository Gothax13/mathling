  /* grown-up dashboard */
  --p-bg: #f3f1f6; --p-card: #ffffff; --p-ink: #1f1b2b; --p-muted: #6a6578; --p-line: #e2deea; --p-accent: #5144c9;
  --f-unseen: #eceaf1; --f-weak: #ef6b6b; --f-learning: #f6c453; --f-strong: #8fd18a; --f-mastered: #2e9b5f;
  color-scheme: light;
}
.t-cute {
  --bg: #fde6f1; --bg2: #ebdcff; --panel: #ffffff; --panel2: #fff3fa; --line: #f0a2cc; --ink: #4a2660; --muted: #8a66a4;
  --accent: #b44fd4; --accent2: #ff74b1; --hl: #fff27a; --good: #20a56a; --bad: #e0466c;
  --plus: #13a35f; --minus: #ee6a1f; --times: #2f6fe0; --div: #9b3fd1;
  --font-n: 'Fredoka', ui-rounded, system-ui, sans-serif; --radius: 26px;
  color-scheme: light;
}
.t-hero {
  --bg: #03051a; --bg2: #0a1140; --panel: #2033b0; --panel2: #0b1462; --line: #eef1ff; --ink: #ffffff; --muted: #a8b5ff;
  --accent: #ffd447; --accent2: #61d0ff; --hl: #ffd447; --good: #6cff9f; --bad: #ff5d73;
  --plus: #7dff9c; --minus: #ffa95c; --times: #7fc4ff; --div: #e39bff;
  --font-d: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --font-b: 'VT323', ui-monospace, 'Courier New', monospace;
  --font-n: 'VT323', ui-monospace, 'Courier New', monospace; --radius: 8px;
  color-scheme: dark;
}
.t-parent { color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 18px; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.t-hero body, body.t-hero { font-size: 24px; }
body.t-parent { overflow: auto; -webkit-user-select: text; user-select: text; background: var(--p-bg); color: var(--p-ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
#app { height: 100%; display: flex; flex-direction: column; }
body.t-parent #app { height: auto; min-height: 100%; }
#app > * { flex: 1 1 auto; min-height: 0; }
#app.loading { opacity: .6; pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

.win { background: var(--panel); border: 4px solid var(--line); border-radius: var(--radius); color: var(--ink); }
.t-cute .win { box-shadow: 0 6px 0 #f5c2de; }
.t-hero .win { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 3px solid var(--line); box-shadow: 0 0 0 2px #050a3a, inset 0 0 0 2px #050a3a; }

/* readable words for Red Panda */
.t-cute .w { border-radius: 8px; padding: 0 2px; cursor: pointer; transition: background .15s; }
.t-cute .w.lit { background: var(--hl); box-shadow: 0 0 0 2px var(--hl); }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); flex: 0 0 auto; }
.top.slim { padding-block: 6px 2px; }
.top-title { flex: 1 1 auto; min-width: 0; font-family: var(--font-d); font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-hero .top-title { font-size: 13px; letter-spacing: .04em; }
.ib { flex: 0 0 auto; min-width: 48px; height: 48px; border-radius: 16px; border: 3px solid var(--line); background: var(--panel); font-size: 22px; display: grid; place-items: center; padding: 0 10px; }
.t-hero .ib { border-radius: 6px; background: var(--panel2); font-size: 20px; }
.ib.wide { font-family: var(--font-d); font-size: 18px; padding: 0 16px; }
.t-hero .ib.wide { font-size: 11px; }
.moon { display: flex; align-items: center; gap: 6px; font-size: 20px; }
.moonbar { width: 70px; height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 15%, transparent); overflow: hidden; }
.moonbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 1s linear; }

/* ---------- home / profile picker ---------- */
.t-home { --ink: #fff; }
.home { position: relative; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(100deg, #ffd0e6 0 50%, #0a1140 50% 100%); }
.home-logo { text-align: center; padding-block: 18px 0; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.home-logo span { display: inline-block; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; font-size: clamp(34px, 6vw, 64px); color: #fff; letter-spacing: .02em;
  background: #2a1d4a; padding: 6px 26px 10px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 4vw, 60px); align-items: center; padding-block: 16px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.pick-card { border: none; display: grid; justify-items: center; gap: 10px; padding: 28px 18px; border-radius: 34px; transition: transform .15s; max-width: 420px; justify-self: center; width: 100%; }
.pick-card:active { transform: scale(.97); }
.pc-cute { background: #fff; color: #4a2660; border: 6px solid #f0a2cc; box-shadow: 0 10px 0 #e48fbd; font-family: 'Fredoka', system-ui, sans-serif; }
.pc-hero { background: linear-gradient(180deg, #2a3fd0, #0b1462); color: #fff; border: 4px solid #eef1ff; border-radius: 10px; box-shadow: 0 0 0 4px #050a3a, 0 10px 0 #000; font-family: 'Press Start 2P', monospace; }
.pick-card.last { outline: 4px dashed rgba(255,255,255,.7); outline-offset: 8px; }
.pc-avatar { width: clamp(110px, 18vw, 170px); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.pc-avatar svg { width: 100%; height: 100%; }
.pc-hero .pc-avatar { background: #050a3a; border: 3px solid #ffd447; border-radius: 8px; }
.pc-hero .pc-avatar span { font-size: clamp(60px, 10vw, 100px); }
.pc-hero .pc-avatar img.art { width: 78%; height: 78%; image-rendering: pixelated; }
.pc-name { font-size: clamp(28px, 4vw, 44px); font-weight: 700; }
.pc-hero .pc-name { font-size: clamp(16px, 2.2vw, 24px); color: #ffd447; }
.pc-sub { font-size: 18px; opacity: .8; }
.pc-hero .pc-sub { font-size: 10px; font-family: 'Press Start 2P', monospace; }
.pc-team { font-size: 30px; min-height: 40px; }
.pc-hero .pc-team { font-family: 'VT323', monospace; font-size: 26px; }
.home-foot { display: flex; justify-content: center; padding-block: 0 18px; }
.home-foot .ib { background: rgba(255,255,255,.85); border-color: #fff; color: #222; }

/* ---------- intro ---------- */
.intro { display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%); overflow: auto; }
.intro-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-block: 10px 24px; padding-left: var(--gut-l); padding-right: var(--gut-r); text-align: center; }
.intro-hello { font-family: var(--font-d); font-size: clamp(30px, 5vw, 52px); font-weight: 700; }
.t-hero .intro-hello { font-size: clamp(16px, 2.6vw, 26px); color: var(--accent); }
.intro-sub { font-size: clamp(24px, 3.4vw, 34px); max-width: 32ch; text-wrap: balance; }
.t-hero .intro-sub { font-size: clamp(26px, 3.4vw, 36px); }
.starters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2vw, 24px); width: 100%; max-width: 900px; margin-top: 10px; }
.starter { display: grid; justify-items: center; gap: 8px; padding: 18px 10px; transition: transform .15s; }
.starter:active { transform: scale(.96); }
.starter-spr { font-size: clamp(64px, 11vw, 120px); }
.starter-name { font-family: var(--font-d); font-size: clamp(22px, 3vw, 34px); font-weight: 700; }
.t-hero .starter-name { font-size: clamp(11px, 1.6vw, 16px); line-height: 1.4; }
.starter-move { color: var(--muted); }

/* ---------- sprites ---------- */
.spr { position: relative; display: inline-grid; place-items: center; line-height: 1; }
.spr .em { display: block; animation: bob 2.4s ease-in-out infinite; }
.t-hero .spr .em { filter: drop-shadow(4px 4px 0 rgba(0,0,0,.55)); }
.t-cute .spr .em { filter: drop-shadow(0 6px 4px rgba(120, 40, 120, .25)); }
.spr.st1 .em { filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 2px var(--glow)); transform: scale(1.08); }
.spr.st2 .em { filter: drop-shadow(0 0 16px var(--glow)) drop-shadow(0 0 6px #fff); transform: scale(1.16); }
.spr.st2::before { content: ''; position: absolute; inset: -14%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--glow) 45%, transparent), transparent 70%); animation: pulse 1.8s ease-in-out infinite; }
.badge-st { position: absolute; top: -8%; right: -12%; font-size: .32em; }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6%) } }
@keyframes pulse { 0%, 100% { opacity: .5; transform: scale(.95) } 50% { opacity: 1; transform: scale(1.05) } }
.etag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: .85em; white-space: nowrap; }
.etag.el-fire { background: color-mix(in srgb, var(--fire) 22%, transparent); }
.etag.el-ice { background: color-mix(in srgb, var(--ice) 22%, transparent); }
.etag.el-zap { background: color-mix(in srgb, var(--zap) 26%, transparent); }
.t-hero .etag { border-radius: 4px; font-weight: 400; }

/* ---------- map ---------- */
.map { display: flex; flex-direction: column; }
.banner { margin-left: var(--gut-l); margin-right: var(--gut-r); padding: 10px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.banner-name { font-family: var(--font-d); font-size: clamp(24px, 3.4vw, 34px); font-weight: 700; display: flex; align-items: center; gap: 10px; }
.t-hero .banner-name { font-size: clamp(13px, 1.8vw, 18px); color: var(--accent); }
.banner-icon { font-size: 1.2em; }
.banner-world { font-family: var(--font-d); font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: #fff; }
.t-hero .banner-world { color: #0b1462; font-size: 10px; border-radius: 3px; }
.hint { font-size: 22px; display: flex; align-items: center; gap: 8px; }
.t-hero .hint { font-size: 24px; color: var(--muted); }
.mapbox { position: relative; flex: 1 1 auto; min-height: 220px; margin: 8px var(--gut-r) 8px var(--gut-l); }
.deco { position: absolute; inset: 0; pointer-events: none; }
.deco span { position: absolute; font-size: clamp(22px, 4vmin, 40px); opacity: .5; transform: translate(-50%, -50%); }
.trail-wrap, .trail { position: absolute; inset: 0; width: 100%; height: 100%; }
.trail polyline { fill: none; stroke: color-mix(in srgb, var(--ink) 35%, transparent); stroke-width: 1.4; stroke-dasharray: 2.5 2.5; vector-effect: non-scaling-stroke; stroke-width: 6px; stroke-linecap: round; }
.node { position: absolute; transform: translate(-50%, -50%); width: clamp(68px, 12vmin, 112px); aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--line); background: var(--panel); font-size: clamp(30px, 5.4vmin, 50px); display: grid; place-items: center; transition: transform .15s; }
.t-hero .node { border-radius: 10px; border: 3px solid var(--line); background: linear-gradient(180deg, var(--panel), var(--panel2)); box-shadow: 0 0 0 3px #050a3a; }
.node.n-k { width: clamp(84px, 15vmin, 136px); font-size: clamp(38px, 7vmin, 64px); }
.node.done { opacity: .75; background: color-mix(in srgb, var(--good) 30%, var(--panel)); color: var(--good); font-weight: 700; }
.t-hero .node.done { color: var(--good); }
.node.lock { opacity: .45; filter: grayscale(.6); }
.node.cur { animation: beckon 1.1s ease-in-out infinite; border-color: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent); }
.t-hero .node.cur { border-color: var(--accent); box-shadow: 0 0 0 3px #050a3a, 0 0 18px var(--accent); }
@keyframes beckon { 0%, 100% { transform: translate(-50%, -50%) scale(1) } 50% { transform: translate(-50%, -50%) scale(1.1) } }
.pstrip { display: flex; align-items: center; gap: 14px; margin: 0 var(--gut-r) max(12px, env(safe-area-inset-bottom, 0px)) var(--gut-l); padding: 8px 16px; text-align: left; }
.pmini { display: grid; justify-items: center; }
.pmini .spr { font-size: 42px; }
.pmini-lv { font-family: var(--font-d); font-size: 14px; }
.t-hero .pmini-lv { font-size: 9px; }
.pstrip-go { margin-left: auto; font-family: var(--font-d); font-size: 20px; }
.t-hero .pstrip-go { font-size: 11px; }

/* area backdrops */
.t-cute .bg-meadow { background: linear-gradient(180deg, #c9ecff 0%, #e8f7ff 42%, #c4f0a8 42%, #a9e48d 100%); }
.t-cute .bg-garden { background: linear-gradient(180deg, #ffd9ec 0%, #fff0f7 42%, #c8f0b5 42%, #ffc2df 100%); }
.t-cute .bg-lava { background: linear-gradient(180deg, #ffd6c4 0%, #fff0e6 42%, #ffb59a 42%, #ff9a86 100%); }
.t-cute .bg-snow { background: linear-gradient(180deg, #d9ecff 0%, #f4f9ff 42%, #ffffff 42%, #e3efff 100%); }
.t-cute .bg-sea { background: linear-gradient(180deg, #cdf3ff 0%, #ebfbff 42%, #93dcf3 42%, #6cc6ea 100%); }
.t-cute .bg-castle { background: linear-gradient(180deg, #e7d8ff 0%, #f8f0ff 42%, #f3c7f0 42%, #dbb8ff 100%); }
.t-hero .bg-meadow { background: linear-gradient(180deg, #13307a 0%, #3d6ad0 45%, #2f6b2c 45%, #163d17 100%); }
.t-hero .bg-forest { background: linear-gradient(180deg, #071a12 0%, #123826 45%, #1d3b1a 45%, #0b1f0c 100%); }
.t-hero .bg-lava { background: linear-gradient(180deg, #1f0505 0%, #6e1606 45%, #8a2a0a 45%, #2d0702 100%); }
.t-hero .bg-snow { background: linear-gradient(180deg, #0f2550 0%, #4b7fc2 45%, #a9c7e6 45%, #5f86b3 100%); }
.t-hero .bg-sea { background: linear-gradient(180deg, #021a33 0%, #0b4b80 45%, #0a5f8f 45%, #03263d 100%); }
.t-hero .bg-castle { background: linear-gradient(180deg, #0b0618 0%, #2a1748 45%, #3a2a55 45%, #120a22 100%); }

/* ---------- team ---------- */
.team { display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%); overflow: auto; }
.teambody, .book { padding-block: 6px 24px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.tlabel { font-family: var(--font-d); font-size: 22px; margin: 12px 0 8px; font-weight: 700; }
.t-hero .tlabel { font-size: 12px; color: var(--accent); }
.tnote { font-family: var(--font-b); font-size: 18px; font-weight: 400; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.ccard { display: grid; justify-items: center; gap: 6px; padding: 14px 10px; text-align: center; transition: transform .15s; }
.ccard:active { transform: scale(.97); }
.ccard.in { outline: 4px solid var(--accent); outline-offset: 2px; }
.ccard.sel { outline: 4px dashed var(--accent2); outline-offset: 2px; animation: beckon2 1s ease-in-out infinite; }
@keyframes beckon2 { 50% { transform: scale(1.04) } }
.ccard-spr { font-size: 64px; }
.ccard-name { font-family: var(--font-d); font-size: 22px; font-weight: 700; }
.t-hero .ccard-name { font-size: 11px; line-height: 1.5; }
.ccard-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.ccard-lv { font-family: var(--font-d); font-size: 15px; }
.t-hero .ccard-lv { font-size: 10px; }
.ccard-move { color: var(--muted); font-size: .9em; }
.xpbar { width: 80%; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 15%, transparent); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent2); }
.tcount { margin-top: 18px; color: var(--muted); text-align: center; }
.tabs { display: flex; gap: 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.tab { font-family: var(--font-d); font-size: 11px; padding: 10px 14px; border: 3px solid var(--line); background: var(--panel2); border-radius: 6px; }
.tab.on { background: var(--accent); color: #0b1462; }
.book-tip { color: var(--muted); margin: 6px 0 12px; }
.brow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 8px 12px; margin-bottom: 8px; }
.brow .bem { font-size: 40px; grid-row: span 2; }
.brow .bname { font-family: var(--font-d); font-size: 11px; color: var(--accent); }
.brow .barea { color: var(--muted); font-size: 20px; text-align: right; }
.brow .binfo { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.brow.unseen { opacity: .5; }

/* ---------- battle ---------- */
.battle { display: flex; flex-direction: column; }
.field { position: relative; flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: center; gap: 8px; padding-block: 6px; padding-left: var(--gut-l); padding-right: var(--gut-r); overflow: hidden; }
.foe { display: grid; justify-items: center; align-content: center; gap: 8px; min-width: 0; }
.foe-card { padding: 8px 14px; min-width: min(300px, 100%); max-width: 100%; display: grid; gap: 6px; }
.foe-name { font-family: var(--font-d); font-size: clamp(20px, 2.8vw, 28px); font-weight: 700; }
.t-hero .foe-name { font-size: clamp(10px, 1.4vw, 14px); color: var(--accent); }
.foe-tags { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 18px; }
.t-hero .foe-tags { font-size: 22px; }
.tag .q { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 15%, transparent); font-weight: 700; }
.foe-spr { font-size: clamp(80px, 21vmin, 190px); }
.foe-spr.boss { font-size: clamp(100px, 27vmin, 240px); }
.party { display: grid; gap: 8px; justify-items: start; align-content: center; min-width: 0; }
.mem { display: flex; align-items: center; gap: 10px; min-width: 0; transition: opacity .3s, filter .3s; }
.mem.out { opacity: .4; filter: grayscale(1); }
.mem-spr { font-size: clamp(44px, 9.5vmin, 88px); flex: 0 0 auto; }
.mem-info { padding: 6px 12px; min-width: 0; display: grid; gap: 2px; }
.mem-name { font-family: var(--font-d); font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-hero .mem-name { font-size: 10px; }
.mem-lv { font-size: 15px; color: var(--muted); }
.t-hero .mem-lv { font-size: 18px; }
.hp { position: relative; height: 14px; width: clamp(90px, 14vw, 170px); border-radius: 8px; background: color-mix(in srgb, var(--ink) 15%, transparent); overflow: hidden; }
.foe-hp { width: 100%; height: 18px; }
.hp i { position: absolute; inset: 0 auto 0 0; background: var(--good); transition: width .5s ease; border-radius: inherit; }
.t-cute .foe-hp i { background: linear-gradient(90deg, #ff9bc6, #c264e0); }
.hp.low i { background: var(--bad); }
.hp b { position: relative; display: block; text-align: center; font-size: 16px; line-height: 18px; font-weight: 400; }
.t-hero .hp { height: 18px; border-radius: 2px; background: #050a3a; }
.t-hero .foe-hp { height: 22px; }
.t-hero .hp b { font-size: 20px; line-height: 20px; }
.t-hero .mem-hp b { font-size: 17px; line-height: 18px; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.proj { position: absolute; font-size: clamp(36px, 7vmin, 64px); transform: translate(-50%, -50%); transition: transform .42s cubic-bezier(.5, -0.3, .7, 1); }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-d); font-weight: 700; font-size: clamp(30px, 6vmin, 54px); color: #fff; -webkit-text-stroke: 2px #2a1040; paint-order: stroke; animation: popup 1.4s ease-out forwards; white-space: nowrap; }
.t-hero .pop { font-family: 'VT323', monospace; font-size: clamp(44px, 8vmin, 72px); -webkit-text-stroke: 3px #000; }
.pop.big { color: var(--hl); font-size: clamp(38px, 7.5vmin, 66px); }
.pop.bad { color: #ff8095; }
.pop.tagpop { font-size: clamp(22px, 4vmin, 34px); color: var(--hl); animation-name: popup2; }
.pop.tagpop.dim { color: #c9d0ff; }
.pop.heart { -webkit-text-stroke: 0; font-size: 34px; animation-name: heartup; }
.pop.h1 { margin-left: -50px } .pop.h2 { margin-left: 50px } .pop.h3 { margin-left: -24px } .pop.h4 { margin-left: 30px } .pop.h5 { margin-left: -70px } .pop.h6 { margin-left: 70px }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6) } 15% { opacity: 1; transform: translate(-50%, -80%) scale(1.15) } 70% { opacity: 1; transform: translate(-50%, -110%) scale(1) } 100% { opacity: 0; transform: translate(-50%, -150%) } }
@keyframes popup2 { 0% { opacity: 0; transform: translate(-50%, 40%) } 20% { opacity: 1; transform: translate(-50%, 70%) } 80% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, 90%) } }
@keyframes heartup { 0% { opacity: 0; transform: translate(-50%, 0) scale(.5) } 20% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1.2) } }
.lunge .em { animation: lunge .38s ease-out; }
.lunge-r .em { animation: lunger .38s ease-out; }
.hurt .em { animation: hurt .48s linear; }
.quake { animation: quake .42s linear; }
.phase .em { animation: phase .8s steps(8); }
.poof .em { animation: poof .9s ease-in forwards; }
.cheer .em { animation: cheer 1.2s ease-in-out forwards; }
.cheer::after { content: '♥'; color: #ff6fa8; position: absolute; right: -10%; top: -6%; font-size: .4em; animation: popin .4s ease-out both; }
.friendly .em { animation: bob 2.4s ease-in-out infinite; }
.caught .em { animation: caught .9s ease-in forwards; }
@keyframes lunge { 30% { transform: translateX(-40%) scale(1.1) } 100% { transform: none } }
@keyframes lunger { 30% { transform: translateX(30%) scale(1.08) } 100% { transform: none } }
@keyframes hurt { 0%, 100% { transform: none; filter: none } 20% { transform: translateX(-8%); filter: brightness(2.2) } 40% { transform: translateX(8%) } 60% { transform: translateX(-5%); filter: brightness(2.2) } 80% { transform: translateX(4%) } }
@keyframes quake { 25% { transform: translate(6px, -4px) } 50% { transform: translate(-6px, 4px) } 75% { transform: translate(4px, 2px) } }
@keyframes phase { 0%, 50%, 100% { filter: none } 25%, 75% { filter: invert(1) hue-rotate(180deg) brightness(1.5) } }
@keyframes poof { 0% { opacity: 1; transform: none } 40% { filter: brightness(3) } 100% { opacity: 0; transform: scale(.2) rotate(30deg) } }
@keyframes cheer { 0% { transform: none } 20% { transform: translateY(-14%) rotate(-8deg) } 40% { transform: translateY(0) rotate(8deg) } 60% { transform: translateY(-10%) rotate(-6deg) } 100% { transform: translateX(-140%); opacity: 0 } }
@keyframes caught { 0% { transform: none } 60% { transform: scale(.4); filter: brightness(3) } 100% { transform: scale(.05); opacity: 0 } }
@keyframes popin { from { transform: scale(0) } to { transform: scale(1) } }

/* command window */
.panel { flex: 0 0 auto; height: clamp(250px, 43vh, 400px); margin: 4px var(--gut-r) max(10px, env(safe-area-inset-bottom, 0px)) var(--gut-l); padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.pmsg { font-family: var(--font-d); font-size: clamp(24px, 3.4vw, 36px); text-align: center; text-wrap: balance; }
.t-hero .pmsg { font-family: var(--font-b); font-size: clamp(30px, 4vw, 42px); }
.pmenu { display: grid; gap: 12px; height: 100%; grid-template-rows: auto 1fr; }
.prompt { font-family: var(--font-d); font-size: clamp(22px, 3vw, 30px); font-weight: 700; text-align: center; }
.t-hero .prompt { font-size: clamp(11px, 1.5vw, 15px); color: var(--accent); text-align: left; }
.atks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 300px); justify-content: center; gap: 12px; min-height: 0; }
.pop.tagpop.combo { margin-top: 1.4em; }
.atk { display: grid; grid-template-rows: 1fr auto auto auto; justify-items: center; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 20px; border: 4px solid var(--line); background: var(--panel2); transition: transform .12s; min-width: 0; }
.atk:active { transform: scale(.96); }
.atk-em { font-size: clamp(40px, 7vmin, 70px); line-height: 1; }
.atk-who { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.atk-move { font-family: var(--font-d); font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; }
.t-hero .atk { border-radius: 6px; border: 3px solid var(--line); background: #0b1462; }
.t-hero .atk:hover, .t-hero .atk:focus-visible { border-color: var(--accent); }
.t-hero .atk-move { font-size: clamp(9px, 1.2vw, 12px); line-height: 1.4; text-align: center; }
.t-hero .atk-who { font-size: 18px; }
.atk.el-fire { border-color: var(--fire); } .atk.el-ice { border-color: var(--ice); } .atk.el-zap { border-color: var(--zap); }
.bigbtn { font-family: var(--font-d); font-size: clamp(22px, 3vw, 30px); font-weight: 700; padding: 14px 30px; border-radius: 999px; border: none; background: var(--accent); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000); justify-self: center; transition: transform .1s; }
.bigbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.bigbtn:disabled { opacity: .35; }
.bigbtn.alt { background: var(--accent2); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent2) 60%, #000); }
.t-hero .bigbtn { border-radius: 6px; font-size: clamp(11px, 1.5vw, 15px); color: #0b1462; padding: 14px 22px; font-weight: 400; box-shadow: 0 0 0 3px #050a3a, 0 5px 0 #050a3a; }
.catchbtn { align-self: center; }

/* problem */
.pprob { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; height: 100%; align-items: stretch; }
.pleft { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; min-width: 0; }
.pnote { font-size: 20px; color: var(--muted); text-align: center; }
.t-hero .pnote { font-size: 26px; }
.pnote.alert { color: var(--ink); font-weight: 700; font-size: 24px; }
.t-hero .pnote.alert { color: var(--accent); font-weight: 400; font-size: 30px; }
.expr { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .18em; font-family: var(--font-n); font-weight: 700; font-size: clamp(48px, 9vmin, 92px); line-height: 1; }
.t-hero .expr { font-weight: 400; font-size: clamp(64px, 12vmin, 124px); }
.expr.long { font-size: clamp(42px, 7.6vmin, 80px); }
.t-hero .expr.long { font-size: clamp(56px, 10vmin, 108px); }
.expr.mini { font-size: 34px; } .t-hero .expr.mini { font-size: 44px; }
.expr.mid { font-size: clamp(40px, 7vmin, 68px); } .t-hero .expr.mid { font-size: clamp(54px, 9vmin, 90px); }
.expr .num { cursor: pointer; }
.op { position: relative; display: inline-grid; justify-items: center; padding: 0 .08em; cursor: pointer; }
.op-plus { color: var(--plus); } .op-minus { color: var(--minus); } .op-times { color: var(--times); } .op-div { color: var(--div); }
.opword { position: absolute; top: 100%; font-family: var(--font-b); font-size: 18px; font-weight: 700; margin-top: 2px; letter-spacing: .02em; }
.eq { color: var(--muted); }
.ans { min-width: 1.6em; padding: 0 .2em; text-align: center; border-radius: 16px; border: 4px dashed var(--line); color: var(--muted); }
.ans.has { border-style: solid; border-color: var(--accent); color: var(--ink); }
.ans.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.t-hero .ans { border-radius: 4px; border-width: 3px; }
.nope { animation: hurt .4s linear; }
.ptools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tool { font-family: var(--font-d); font-size: 20px; padding: 8px 16px; border-radius: 999px; border: 3px solid var(--line); background: var(--panel2); }
.t-hero .tool { font-size: 11px; border-radius: 4px; background: #0b1462; }
.tool.ghost { background: transparent; color: var(--muted); }
.pad { display: grid; grid-template-columns: repeat(3, clamp(62px, 9vmin, 88px)); grid-auto-rows: 1fr; gap: 8px; height: 100%; }
.key { border-radius: 18px; border: 3px solid var(--line); background: var(--panel2); font-family: var(--font-n); font-weight: 700; font-size: clamp(28px, 5vmin, 44px); display: grid; place-items: center; transition: transform .08s; min-height: 0; padding: 0; }
.key:active { transform: scale(.93); background: var(--hl); }
.t-hero .key { border-radius: 4px; background: #0b1462; font-weight: 400; font-size: clamp(36px, 6vmin, 52px); }
.k-ok { background: var(--good); border-color: var(--good); color: #fff; }
.t-hero .k-ok { background: #1f7a43; border-color: var(--good); }
.k-del { color: var(--bad); }

/* ---------- overlays ---------- */
#ov { position: relative; z-index: 50; }
.ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gut-r) max(16px, env(safe-area-inset-bottom, 0px)) var(--gut-l); background: rgba(20, 8, 40, .55); animation: fadein .2s ease-out; }
@keyframes fadein { from { opacity: 0 } }
.ov-card { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 24px; display: grid; gap: 14px; justify-items: center; text-align: center; animation: popin .25s ease-out; }
.ov-big { font-size: 96px; line-height: 1; }
.ov-spr { font-size: 110px; }
.ov-title { font-family: var(--font-d); font-size: clamp(26px, 4vw, 38px); font-weight: 700; text-wrap: balance; }
.t-hero .ov-title { font-size: clamp(13px, 2vw, 18px); line-height: 1.6; color: var(--accent); }
.ov-line { font-size: 22px; }
.t-hero .ov-line { font-size: 28px; }
.ov-card.star .ov-big { animation: spin 1.2s ease-out; }
.ov-card.evolve .evolving .em { animation: evolveflash 1.6s steps(10); }
@keyframes spin { from { transform: rotate(-200deg) scale(.2) } to { transform: none } }
@keyframes evolveflash { 0%, 20%, 40%, 60% { filter: brightness(4) saturate(0) } 10%, 30%, 50% { filter: none } }

/* help */
.help-card { width: min(920px, 100%); text-align: left; justify-items: stretch; gap: 10px; }
.help-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.help-title { font-family: var(--font-d); font-size: 28px; font-weight: 700; }
.t-hero .help-title { font-size: 14px; color: var(--accent); }
.help-head .expr { justify-content: flex-start; }
.help-x { margin-left: auto; }
.help-steps { display: flex; gap: 6px; justify-content: center; }
.help-steps i { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 18%, transparent); }
.help-steps i.cur { background: var(--accent); } .help-steps i.done { background: var(--good); }
.vis { display: grid; gap: 14px; justify-items: center; }
.vnote { font-size: 26px; text-align: center; text-wrap: balance; }
.t-hero .vnote { font-size: 30px; }
.vrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
.bubble { width: 92px; height: 92px; border-radius: 50%; border: 5px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--panel)); font-family: var(--font-n); font-weight: 700; font-size: 48px; }
.vop { font-family: var(--font-n); font-weight: 700; font-size: 48px; }
.dots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; }
.dots.tens { display: grid; grid-template-columns: repeat(10, auto); }
.dot { width: 54px; height: 54px; border-radius: 50%; border: 4px dashed var(--accent2); background: transparent; font-family: var(--font-n); font-weight: 700; font-size: 24px; color: #fff; display: grid; place-items: center; padding: 0; }
.dot.full { border-style: solid; background: var(--accent2); }
.dot.on { border-style: solid; background: var(--accent); border-color: var(--accent); }
.dot.x { background: transparent; border-style: dashed; opacity: .35; position: relative; }
.dot.x::after { content: '✕'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--bad); font-size: 30px; opacity: 1; }
.frames { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.frame { display: grid; grid-template-columns: repeat(5, 52px); grid-auto-rows: 52px; gap: 6px; padding: 8px; border: 4px solid var(--line); border-radius: 14px; }
.cell { border-radius: 10px; border: 3px dashed color-mix(in srgb, var(--ink) 25%, transparent); background: transparent; display: grid; place-items: center; font-family: var(--font-n); font-weight: 700; font-size: 22px; padding: 0; }
.cell.fill { background: var(--accent2); border-style: solid; border-color: var(--accent2); }
.cell.on { background: var(--accent); border-style: solid; border-color: var(--accent); color: #fff; }
.vlbl { font-family: var(--font-n); font-weight: 700; font-size: 34px; min-height: 40px; }
.vlbl.skip { font-size: 28px; color: var(--accent); }
.vbtns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.array { display: grid; gap: 6px; }
.arow { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 12px; border: 3px dashed var(--line); background: transparent; }
.arow i { width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--times) 35%, transparent); }
.arow.on { border-style: solid; border-color: var(--times); }
.arow.on i { background: var(--times); }
.rowlbl { min-width: 2.4em; font-family: var(--font-n); font-weight: 700; font-size: 24px; margin-left: 8px; text-align: left; }
.deal { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pilewrap { display: grid; justify-items: center; color: var(--muted); }
.pile { font-family: var(--font-n); font-weight: 700; font-size: 44px; color: var(--ink); }
.grps { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
.grp { width: 92px; min-height: 92px; border-radius: 50%; border: 4px solid var(--div); display: flex; flex-wrap: wrap; gap: 4px; align-content: center; justify-content: center; padding: 10px; }
.grp i { width: 14px; height: 14px; border-radius: 50%; background: var(--div); }
.vq { grid-template-columns: minmax(0, 1fr) auto; align-items: center; justify-items: stretch; }
.vq-left { display: grid; gap: 10px; justify-items: center; }
.vq .pad { height: auto; grid-auto-rows: clamp(56px, 8vmin, 76px); }
.vmsg { font-size: 24px; color: var(--accent); text-align: center; min-height: 30px; }
.nline { width: min(420px, 100%); }
.nline svg { width: 100%; height: auto; display: block; }
.nl-axis, .nline line { stroke: var(--ink); stroke-width: 3; }
.nl-hop { fill: none; stroke: var(--minus); stroke-width: 3.5; stroke-dasharray: 6 5; }
.nl-tip { fill: var(--minus); }
.nl-a { fill: var(--accent); } .nl-b { fill: var(--panel); stroke: var(--minus); stroke-width: 3; }
.nl-t { fill: var(--ink); font-family: var(--font-n); font-size: 18px; font-weight: 700; text-anchor: middle; }
.nl-d { fill: var(--minus); font-family: var(--font-n); font-size: 18px; font-weight: 700; text-anchor: middle; }

/* gate */
.gate .gate-card { background: #fff; color: #222; border-radius: 20px; padding: 26px; width: min(380px, 100%); display: grid; gap: 12px; justify-items: center; text-align: center; font-family: system-ui, -apple-system, sans-serif; }
.gate-title { font-weight: 700; font-size: 22px; }
.gate p { margin: 0; color: #555; font-size: 16px; }
.gate-ring { --p: 0; width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; font-size: 54px; cursor: pointer; touch-action: none;
  background: radial-gradient(circle, #fff 58%, transparent 59%), conic-gradient(#5144c9 calc(var(--p) * 360deg), #e5e2ef 0); }
.gate-x { background: none; border: none; color: #5144c9; font-size: 16px; padding: 8px; }

/* rest */
.rest { display: flex; flex-direction: column; background: linear-gradient(180deg, #120a3a, #2a1a5e 60%, #3d2a78); color: #fff; overflow: auto; }
.t-cute .rest { background: linear-gradient(180deg, #3b2a7a, #7a4fb8 60%, #c98ad6); }
.rest .top-title, .rest .top { color: #fff; }
.rest-sky { display: grid; justify-items: center; gap: 10px; padding: 10px; }
.rest-moon { font-size: 110px; filter: drop-shadow(0 0 30px #fff6b0); }
.rest-row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.sleeper { display: grid; justify-items: center; }
.sleeper .spr { font-size: 70px; filter: saturate(.7) brightness(.85); }
.sleeper .spr .em { animation: bob 4s ease-in-out infinite; }
.zz { font-family: var(--font-d); font-size: 18px; opacity: .8; animation: bob 2s ease-in-out infinite; }
.rest-card { margin: 10px auto 24px; width: min(620px, calc(100% - 32px)); padding: 20px 24px; text-align: center; }
.rest-title { font-family: var(--font-d); font-size: 36px; font-weight: 700; }
.t-hero .rest-title { font-size: 18px; color: var(--accent); }
.rest-card p { font-size: 24px; margin: 10px 0; }
.t-hero .rest-card p { font-size: 30px; }
.rest-count { color: var(--accent); font-weight: 700; }

/* ---------- grown-up dashboard ---------- */
.pd { min-height: 100%; }
.pd-load { padding: 40px; text-align: center; color: var(--p-muted); }
.pd-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding-block: 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--p-card); border-bottom: 1px solid var(--p-line); }
body.t-parent::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--p-card); }
.pd-brand { display: flex; align-items: baseline; gap: 8px; }
.pd-brand b { font-family: 'Fredoka', system-ui, sans-serif; font-size: 22px; color: var(--p-accent); }
.pd-brand span { color: var(--p-muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.pd-tabs { display: flex; gap: 4px; background: var(--p-bg); padding: 4px; border-radius: 12px; }
.pd-tab { border: none; background: none; padding: 8px 16px; border-radius: 9px; font-weight: 600; color: var(--p-muted); }
.pd-tab.on { background: var(--p-card); color: var(--p-ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pd-exit { margin-left: auto; border: 1px solid var(--p-line); background: var(--p-card); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.pd-main { max-width: 1040px; margin: 0 auto; padding-block: 16px 40px; padding-left: var(--gut-l); padding-right: var(--gut-r); display: grid; gap: 14px; }
.pd-sync { font-size: 13px; padding: 10px 14px; border-radius: 10px; }
.pd-sync.ok { background: #e7f6ee; color: #1d6b43; }
.pd-sync.local { background: #fff4df; color: #7a5310; }
.pd-card { background: var(--p-card); border: 1px solid var(--p-line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.pd-card h2 { margin: 0 0 10px; font-size: 16px; }
.pd-card.empty { text-align: center; padding: 40px; }
.pd-help { color: var(--p-muted); margin: 0 0 12px; font-size: 13px; line-height: 1.5; max-width: 75ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.tile-k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--p-muted); }
.tile-v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile-v.sm { font-size: 15px; font-weight: 600; line-height: 1.35; }
.tile-s { font-size: 13px; color: var(--p-muted); margin-top: 2px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .bar { fill: var(--p-accent); }
.chart .bv { fill: var(--p-ink); font-size: 11px; text-anchor: middle; font-variant-numeric: tabular-nums; }
.chart .bx { fill: var(--p-muted); font-size: 11px; text-anchor: middle; }
.chart .base { stroke: var(--p-line); }
.tablewrap { overflow-x: auto; }
table.sk { width: 100%; border-collapse: collapse; font-size: 14px; }
table.sk th { text-align: left; font-size: 12px; color: var(--p-muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--p-line); white-space: nowrap; }
table.sk td { padding: 8px; border-bottom: 1px solid var(--p-line); vertical-align: middle; }
table.sk td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.sk tr.st-locked { color: var(--p-muted); }
.sk-name { font-weight: 600; }
.sk-note { font-size: 12px; color: var(--p-muted); }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.c-mastered { background: #dff3e7; color: #1d6b43; } .c-learning { background: #e7e4fb; color: #3e33a8; } .c-ready { background: #fff1d6; color: #7a5310; } .c-locked { background: #f0eef4; color: #7b768a; }
table.sk select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--p-line); background: var(--p-card); color: var(--p-ink); }
.seg { display: inline-flex; gap: 4px; background: var(--p-bg); padding: 4px; border-radius: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.seg-b { border: none; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; color: var(--p-muted); }
.seg-b.on { background: var(--p-card); color: var(--p-ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
table.grid { border-collapse: separate; border-spacing: 3px; font-size: 12px; font-variant-numeric: tabular-nums; }
table.grid th { color: var(--p-muted); font-weight: 600; min-width: 26px; text-align: center; }
table.grid th.corner { font-size: 10px; white-space: nowrap; }
table.grid td { width: 30px; height: 26px; padding: 0; border-radius: 5px; }
table.grid td button { display: block; width: 100%; height: 100%; border: none; background: none; padding: 0; }
table.grid td.na { background: transparent; }
.f-unseen { background: var(--f-unseen); } .f-weak { background: var(--f-weak); } .f-learning { background: var(--f-learning); } .f-strong { background: var(--f-strong); } .f-mastered { background: var(--f-mastered); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--p-muted); }

.cell-detail { margin-top: 10px; font-size: 14px; min-height: 20px; }

.sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
.set { display: grid; gap: 4px; align-content: start; }

.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.act { border: 1px solid var(--p-line); background: var(--p-bg); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.danger { border: 1px solid #f1c4c4; background: #fff5f5; color: #a12d2d; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.about p { color: var(--p-muted); font-size: 14px; line-height: 1.55; max-width: 75ch; margin: 0 0 8px; }

/* ---------- narrow screens ---------- */
@media (orientation: portrait) {
  .panel { height: clamp(300px, 46vh, 520px); }
  .field { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

  .home-cards { grid-template-columns: 1fr; gap: 14px; }

  .starter-spr { grid-row: span 3; font-size: 60px; }
  .field { grid-template-columns: 1fr; grid-template-rows: auto auto; }
  .party { grid-auto-flow: column; justify-content: center; }
  .mem { flex-direction: column; gap: 2px; }

  .panel { height: auto; min-height: 240px; padding: 10px; }
  .pprob { grid-template-columns: 1fr; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- walkable worlds ---------- */
.world { display: flex; flex-direction: column; }
.wtop { flex-wrap: nowrap; }

.t-hero .actlbl { color: #0b1462; border-radius: 3px; font-size: .8em; }
.meter { display: flex; gap: 3px; font-size: 22px; color: color-mix(in srgb, var(--ink) 30%, transparent); }
.meter i { font-style: normal; }
.meter i.on { color: var(--accent); text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent); }
.t-hero .meter { font-size: 18px; color: #3a4aa8; }
.t-hero .meter i.on { color: #7fe8ff; text-shadow: 0 0 8px #7fe8ff; }
.gems { display: flex; align-items: center; gap: 2px; font-family: var(--font-d); font-size: 20px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 3px solid var(--line); white-space: nowrap; }
.t-hero .gems { font-size: 12px; border-radius: 6px; background: var(--panel2); }
.ib { position: relative; }
.ibadge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-family: system-ui, sans-serif; display: grid; place-items: center; font-weight: 700; }
.wwrap { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding-block: 4px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.wmap { --t: 48px; position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 4px var(--line), 0 8px 0 rgba(0,0,0,.12); touch-action: manipulation; cursor: pointer; }

.wtiles { display: grid; grid-auto-rows: var(--t); gap: 0; }

.ent { position: absolute; width: var(--t); height: var(--t); display: grid; place-items: center; font-size: calc(var(--t) * .78); line-height: 1; pointer-events: none; transition: opacity .35s, transform .35s; }
.ent .eem { display: block; }
.ent.gone { opacity: 0; transform: scale(1.6); }
.avatar { z-index: 4; transition: left .165s linear, top .165s linear; }
.avatar .spr { font-size: calc(var(--t) * .86); }
.avatar.flip .em { transform: scaleX(-1); }

.e-npc .eem, .e-shop .eem { animation: bob 2.6s ease-in-out infinite; }
.e-mon .eem { animation: wiggle 1.6s ease-in-out infinite; }
.e-wild .eem { animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 0 6px #fff); }
.e-gem .eem { font-size: .62em; animation: sparkle 1.4s ease-in-out infinite; }

.crown { position: absolute; top: -18%; font-size: .45em; }
.e-gate { background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent) 0 6px, color-mix(in srgb, var(--accent) 25%, transparent) 6px 12px); box-shadow: inset 0 0 12px var(--accent); }
.e-gate .eem { animation: pulse 1.6s ease-in-out infinite; }
.e-exit .eem { font-size: .6em; animation: beckon2 1.2s ease-in-out infinite; }
.e-chest .eem { font-size: .75em; }
.bub { position: absolute; top: -12%; right: 0; min-width: 22px; height: 22px; border-radius: 11px; font: 700 15px/22px system-ui, sans-serif; text-align: center; color: #3a2400; background: #ffd447; box-shadow: 0 2px 0 rgba(0,0,0,.25); animation: bob 1.2s ease-in-out infinite; }
.bub.ready { background: #6cff9f; color: #063a1a; }
.bub.busy { background: #e9e6f2; color: #555; }
.lockb { position: absolute; font-size: .45em; bottom: 0; right: 0; }
.wpop { position: absolute; transform: translate(-50%, -30%); font-family: var(--font-d); font-weight: 700; font-size: calc(var(--t) * .4); color: #fff; -webkit-text-stroke: 2px #2a1040; paint-order: stroke; white-space: nowrap; pointer-events: none; z-index: 6; animation: popup 1.2s ease-out forwards; }
.t-hero .wpop { font-family: 'VT323', monospace; font-size: calc(var(--t) * .6); -webkit-text-stroke: 2px #000; }
@keyframes wiggle { 0%, 100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) translateY(-4%) } }
@keyframes sparkle { 0%, 100% { transform: scale(.9); filter: brightness(1) } 50% { transform: scale(1.08); filter: brightness(1.4) } }
.wbottom { display: flex; gap: 10px; align-items: stretch; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 4px max(10px, env(safe-area-inset-bottom, 0px)); }

.t-hero .ccard-gear { font-size: 18px; border-radius: 4px; }

.t-hero .world { background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 75%); }

/* talk + story + shop */
.talkov { place-items: end center; }
.talk { width: min(860px, 100%); display: flex; gap: 18px; align-items: flex-start; padding: 18px 22px; animation: slideup .25s ease-out; }
@keyframes slideup { from { transform: translateY(40px); opacity: 0 } }
.talk-face { font-size: 76px; line-height: 1; flex: 0 0 auto; }
.talk-face.sm { font-size: 54px; }
.talk-main { flex: 1; min-width: 0; display: grid; gap: 10px; }
.talk-name { font-family: var(--font-d); font-weight: 700; font-size: 20px; color: var(--accent); }
.t-hero .talk-name { font-size: 12px; }
.talk-text { font-size: 26px; line-height: 1.35; }
.t-hero .talk-text { font-size: 30px; line-height: 1.15; }
.talk-text.sm { font-size: 20px; } .t-hero .talk-text.sm { font-size: 24px; }
.talk-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.talk-btns .bigbtn { font-size: 22px; padding: 10px 24px; }
.t-hero .talk-btns .bigbtn { font-size: 12px; }
.story { width: min(980px, 100%); text-align: left; justify-items: stretch; }
.story-head { display: flex; align-items: center; gap: 14px; }
.story-n { color: var(--muted); font-size: 16px; }
.story-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.story-left { display: grid; gap: 12px; justify-items: center; text-align: center; }
.story-text { font-size: 30px; line-height: 1.35; text-wrap: balance; }
.t-hero .story-text { font-size: 34px; line-height: 1.15; }
.story .pad { height: auto; grid-auto-rows: clamp(56px, 8vmin, 76px); }
.pics { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
.pics-row { display: flex; flex-wrap: wrap; gap: 4px; font-size: 32px; max-width: 360px; justify-content: center; }
.pics-row .gone { opacity: .25; filter: grayscale(1); position: relative; }
.pics-row.empty span { color: var(--accent2); font-size: 30px; }
.pics-plus { font-family: var(--font-n); font-weight: 700; font-size: 38px; }
.story-ans { display: flex; align-items: center; gap: 12px; font-size: 24px; }
.story-ans .ans { font-family: var(--font-n); font-weight: 700; font-size: 52px; }
.t-hero .story-ans .ans { font-weight: 400; font-size: 64px; }
.story-eq:empty { display: none; }
.shop { width: min(720px, 100%); justify-items: stretch; text-align: left; }
.shop-gems { margin-left: auto; font-family: var(--font-d); font-size: 22px; white-space: nowrap; }
.t-hero .shop-gems { font-size: 13px; }
.shop-list { display: grid; gap: 10px; }
.shop-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 16px; border: 3px solid var(--line); background: var(--panel2); }
.t-hero .shop-row { border-radius: 4px; background: #0b1462; }
.shop-row.owned { opacity: .7; }
.shop-em { font-size: 40px; }
.shop-name { font-family: var(--font-d); font-weight: 700; font-size: 20px; }
.t-hero .shop-name { font-size: 11px; line-height: 1.5; }
.shop-eff { color: var(--muted); font-size: 17px; }
.t-hero .shop-eff { font-size: 22px; }
.shop-owned { font-family: var(--font-d); color: var(--good); }
.bigbtn.buy { font-size: 20px; padding: 10px 18px; }
.t-hero .bigbtn.buy { font-size: 12px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: 100%; }
.pickc { display: grid; justify-items: center; gap: 4px; padding: 10px; }
.pickc .spr { font-size: 50px; }
.pick-cur { font-size: 14px; color: var(--muted); }
.t-hero .pick-cur { font-size: 18px; }
.gear-list { display: grid; gap: 8px; width: 100%; }

.gate-sk span { color: var(--accent); }
.t-hero .gate-sk span { color: #7fe8ff; }
.qline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; font-size: 20px; }
.qface { font-size: 34px; } .qarea { font-size: 24px; }
.pop.tagpop.gem { margin-top: 2.2em; color: #bff4ff; }
@media (max-width: 640px) {
  .wtop { flex-wrap: wrap; }
  .meter { order: 9; }
  .story-body { grid-template-columns: 1fr; }
  .talk { flex-direction: column; gap: 6px; }
  .talk-face { font-size: 48px; }
  .qtrack { font-size: 16px; }
}

/* report card */
.rc-head { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.rc-head h2 { margin: 0; }
.rc-sum { font-size: 16px; line-height: 1.5; margin: 10px 0 4px; max-width: 75ch; }
.rc-status { font-size: 13px; color: var(--p-accent); min-height: 4px; margin: 4px 0; }
.rc-status:empty { display: none; }
.rc-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 10px; }
.rc-col { border-radius: 12px; padding: 12px 14px; min-width: 0; }
.rc-col h3 { margin: 0 0 8px; font-size: 14px; }

.rc-col.good { background: #ecf7f0; } .rc-col.good h3 { color: #1d6b43; }
.rc-col.work { background: #efedfc; } .rc-col.work h3 { color: #3e33a8; }
.rc-col.hard { background: #fdf0ec; } .rc-col.hard h3 { color: #a2401f; }
.rc-t { font-weight: 600; font-size: 14px; }
.rc-d { font-size: 13px; color: var(--p-muted); margin-top: 2px; }
.rc-bar { position: relative; height: 16px; border-radius: 8px; background: #dcd8f3; margin-top: 6px; overflow: hidden; }
.rc-bar i { position: absolute; inset: 0 auto 0 0; background: var(--p-accent); border-radius: 8px; }
.rc-bar span { position: relative; display: block; text-align: right; padding-right: 6px; font-size: 11px; line-height: 16px; font-weight: 700; color: #1f1b2b; font-variant-numeric: tabular-nums; }
.rc-ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rc-ex span { background: #fff; border: 1px solid #f1c9bb; border-radius: 6px; padding: 1px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.rc-tip { font-size: 13px; margin-top: 6px; line-height: 1.45; }
.copybox { display: block; width: 100%; min-height: 160px; margin-top: 8px; font: 12px ui-monospace, monospace; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
label.act { cursor: pointer; display: inline-block; }

/* ---------- v4: compact battle window (keeps the whole fight visible) ---------- */
.panel { height: clamp(150px, 26vh, 214px); padding: 10px 16px; }
.pmsg { font-size: clamp(22px, 2.8vw, 32px); }
.t-hero .pmsg { font-size: clamp(28px, 3.4vw, 40px); }
.pmenu { gap: 6px; }
.prompt { font-size: clamp(18px, 2.4vw, 24px); }
.t-hero .prompt { font-size: clamp(10px, 1.3vw, 13px); }

<script>
(() => {
'use strict';
/* Mathlings art: everything is drawn in code, so the game stays one file and loads nothing from outside.
   Hamstey Man: NES-style pixel sprites (shapes on a 24px grid, auto outline + shading, scaled up crisp).
   Red Panda: soft rounded SVG creatures with big eyes. */
const ART = (() => {
  const cache = {};
  /* ---------------- pixel renderer ---------------- */
  const hexRGB = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
  const mul = (c, f) => c.map(v => Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f))));
  function raster(N, ops) {
    const g = Array.from({ length: N }, () => Array(N).fill(null));
    const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c; };
    for (const op of ops) {
      if (!op) continue;
      const [t, ...a] = op;
      if (t === 'R') { const [x, y, w, h, c] = a; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, c); }
      else if (t === 'E') {
        const [cx, cy, rx, ry, c] = a;
        for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
          const dx = (x - cx) / (rx + 0.5), dy = (y - cy) / (ry + 0.5); if (dx * dx + dy * dy <= 1) set(x, y, c);
        }
      } else if (t === 'L') {
        const [x0, y0, x1, y1, c, w = 1] = a; const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
        for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n; set(x, y, c); if (w > 1) { set(x + 1, y, c); set(x, y + 1, c); } if (w > 2) { set(x - 1, y, c); set(x, y - 1, c); } }
      } else if (t === 'T') {
        const [pts, c] = a; const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++) for (let x = Math.floor(Math.min(...xs)); x <= Math.ceil(Math.max(...xs)); x++) {
          let inside = false;
          for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const [xi, yi] = pts[i], [xj, yj] = pts[j];
            if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
          }
          if (inside) set(x, y, c);

/* Mathlings adaptive engine: pure logic, no DOM.
   Per-fact Leitner boxes + spaced, interleaved selection + mastery / test-out rules. */
const Engine = (() => {
  const SYM = { '+': '+', '-': '−', 'x': '×', '/': '÷' };
  const WORD = { '+': 'plus', '-': 'minus', 'x': 'times', '/': 'divided by' };
  const DAY = 864e5;

  // ---------- fact builders ----------
  const addF = (a, b) => { const lo = Math.min(a, b), hi = Math.max(a, b); return { key: `+:${lo}:${hi}`, op: '+', a: lo, b: hi, ans: lo + hi }; };
  const subF = (a, b) => ({ key: `-:${a}:${b}`, op: '-', a, b, ans: a - b });
  const mulF = (a, b) => { const lo = Math.min(a, b), hi = Math.max(a, b); return { key: `x:${lo}:${hi}`, op: 'x', a: lo, b: hi, ans: lo * hi }; };
  const divF = (v, q) => ({ key: `/:${v * q}:${v}`, op: '/', a: v * q, b: v, ans: q });
  const missF = (a, c) => ({ key: `?:${a}:${c}`, op: '+', a, b: c - a, c, ans: c - a, form: 'missing' });
  const uniq = (arr) => { const seen = new Set(); return arr.filter(f => !seen.has(f.key) && seen.add(f.key)); };
  const rint = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));

  // ---------- skill tree ----------
  const SKILLS = [
    { id: 'add5', name: 'Adding within 5', kid: 'Add to 5', fam: 'add', kind: 'fact', req: [], tm: 1,

// node layout per area: b = battle, c = catch, k = boss
function areaNodes(area) {
  const nCatch = area.catch === 'starters' ? 2 : area.catch.length;
  if (nCatch === 2) return ['b', 'c', 'b', 'c', 'b', 'k'];
  return ['b', 'b', 'c', 'b', 'b', 'k'];
}

  const act = Math.min(3, P.act || 1); const c = gateCount(P);
  return `${ACT_NAMES[act]}, ${c.lit} of ${c.n} gate ${P.settings.words ? 'stars' : 'crystals'} lit`;
}
function trendLine(r) {
  const w = r.trend.week, pv = r.trend.prev;
  if (!w.n) return 'No play in the last 7 days.';
  const mins = Math.round(w.ms / 60000);
  const pace = mins >= 3 ? ` About ${mins} minutes of play, ${(w.n / mins * 10).toFixed(0)} problems per 10 minutes.` : '';
  return `Last 7 days: ${w.n} problems on ${w.days} day${w.days === 1 ? '' : 's'}, ${pctS(w.acc)} right on the first try` + (pv.n ? ` (the week before: ${pctS(pv.acc)}).` : '.') + pace;
}
function summaryText(P, r) {
  const name = pName(P); const total = Object.values(P.log).reduce((a, l) => a + l.n, 0);
  if (total < 15) return `${name} hasn’t played much yet. Check back after a couple of sessions.`;
  const bits = [`${name} is in ${storyLine(P)}.`];
  const top = r.strengths[0]; if (top) bits.push(`Strongest: ${top.title.toLowerCase()}.`);
  const w = [...r.working].sort((a, b) => b.pct - a.pct)[0]; if (w) bits.push(`Working on ${w.title.toLowerCase()} (${w.pct}% of the way to mastered).`);
  const s = r.struggles[0]; if (s) bits.push(`Trickiest right now: ${s.title.toLowerCase()}${s.examples.length ? `, like ${s.examples.slice(0, 2).join(' and ')}` : ''}.`);
  else bits.push('Nothing stands out as a struggle right now.');
  return bits.join(' ');
}
function reportText(P) {

  const L = [`Mathlings report: ${pName(P)} (${d})`, `Story: ${storyLine(P)} · ${moneyLine(P)}`, trendLine(r), challengeLine(P), towerLine(P), villageLine(P), ...v7Lines(P), speedLine(P), readingLine(P)].filter(Boolean);
  L.push('', summaryText(P, r), '', 'Doing well');
  (r.strengths.length ? r.strengths : [{ title: 'Not enough data yet', detail: '' }]).forEach(x => L.push(`- ${x.title}${x.detail ? ': ' + x.detail : ''}`));
  L.push('', 'Working on');
  (r.working.length ? r.working : [{ title: 'Nothing in progress (waiting for the next act)', pct: null, needs: [] }]).forEach(x => L.push(`- ${x.title}${x.pct != null ? `: ${x.pct}% of the way` : ''}${x.needs.length ? ` (needs ${x.needs.join('; ')})` : ''}`));
  L.push('', 'Needs practice');
  (r.struggles.length ? r.struggles : [{ title: 'Nothing stands out right now', detail: '', examples: [], tip: '' }]).forEach(x => L.push(`- ${x.title}${x.detail ? ': ' + x.detail : ''}${x.examples.length ? `. Examples: ${x.examples.join(', ')}` : ''}${x.tip ? `. Tip: ${x.tip}` : ''}`));
  if (P.settings.words) { const w = E.wordStats(P); const wk = weekWords(P);
    L.push('', 'Sight words', `- Knows ${w.known.length} of ${w.total} (${w.known.join(', ') || 'none yet'})`, `- Learning: ${w.learning.join(', ') || 'none'}`, w.tricky.length ? `- Tricky: ${w.tricky.join(', ')}` : '- Tricky: none',
      wk.n ? `- Last 7 days: ${wk.n} word turn${wk.n > 1 ? 's' : ''}, ${pctS(wk.c / wk.n)} right the first time` : '- No word turns in the last 7 days'); }

/* ---------- backup and restore ---------- */
function backupCard(P) {
  const status = h('div', { class: 'rc-status', role: 'status' });
  const file = h('input', { type: 'file', id: 'restore-file', accept: '.json,application/json', class: 'vh' });
  file.addEventListener('change', () => { const f = file.files && file.files[0]; if (f) readBackup(f, status); file.value = ''; });
  const save = async () => {
    const data = JSON.stringify({ app: 'mathlings', v: 2, saved: new Date().toISOString(), profile: P });
    const filename = `mathlings-${P.id}-${E.dayKey()}.json`;
    try {
      if (IS_ARTIFACT) {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data }); status.textContent = 'Backup saved.'; return; }
        return copyText(data, status, 'Downloads are off here, so the backup was copied as text instead.');
      }
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      status.textContent = `Saved ${filename}. On an iPad it goes to Files › Downloads.`;
    } catch (e) { status.textContent = 'The backup could not be saved. Try again.'; }
  };
  return h('section', { class: 'pd-card' }, h('h2', null, 'Backup and move progress'),
    h('p', { class: 'pd-help' }, 'Progress lives on the device the kid plays on. Save a backup file now and then so a cleared browser can’t erase it. Loading a backup restores progress, or lets you view the other kid’s report on this device.'),
    h('div', { class: 'acts' },
      P ? h('button', { class: 'act', onclick: save }, `Save ${pName(P)}’s backup file`) : null,
      h('label', { class: 'act', for: 'restore-file' }, 'Load a backup file'), file),
    status);
}
function readBackup(f, status) {
  const rd = new FileReader();
  rd.onload = () => {
    let obj; try { obj = JSON.parse(rd.result); } catch (e) { status.textContent = 'That file isn’t a Mathlings backup.'; return; }
    const P = obj && obj.profile; if (P && P.id === 'gothax') P.id = 'hamstey';
    if (!obj || obj.app !== 'mathlings' || !P || !PROFILES.some(p => p.id === P.id) || !P.skills) { status.textContent = 'That file isn’t a Mathlings backup.'; return; }
    const cur = PD.data[P.id]; const nm = pName(P);
    const when = new Date(obj.saved).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const n = Object.values(P.log || {}).reduce((a, l) => a + l.n, 0);
    const doIt = () => {
      const fresh = repairP(P); fresh.updated = Date.now();
      PD.data[P.id] = fresh; if (G.P && G.P.id === P.id) G.P = fresh;
      Store.save(fresh, true); PD.sel = P.id; renderParent();
    };
    if (!cur) return doIt();
    status.replaceChildren(`Replace ${nm}’s progress on this device with the backup from ${when} (${n} problems)? `,
      h('button', { class: 'danger', onclick: doIt }, 'Replace'), ' ', h('button', { class: 'act', onclick: () => { status.textContent = ''; } }, 'Cancel'));
  };
  rd.readAsText(f);
}

/* ---------- v7: save migration ---------- */
function v7Repair(P) {
  const g = P.g; const th = P.id === 'hamstey' ? 'hero' : 'cute';
  // gear: one item per creature becomes up to 3 slots (weapon / armor / charm)
  (g.roster || []).forEach(c => {
    if (c.gear !== undefined) { if (c.gear) { const it = GEAR[th].find(i => i.id === c.gear); c.eq = c.eq || {}; if (it) c.eq[slotOf(it)] = it.id; } delete c.gear; }
    c.eq = c.eq || {};
  });
  g.tips = g.tips || {};
  g.castle = g.castle || { rooms: {}, raids: 0, raidNext: 0, rank: 0 };
  g.castle.rooms = g.castle.rooms || {};
  g.bounty = g.bounty || { day: null, list: [], done: 0 };
  g.stats7 = g.stats7 || { quick: 0, hero: { n: 0, c: 0 }, combos: 0, guards: 0, hatched: 0, care: 0, raids: 0 };
  g.starGifts = g.starGifts || {};
  g.wardrobe = g.wardrobe || [];
  if (!g.v7) {
    g.v7 = Date.now();
    g.v7new = !!g.started; // returning players get the "what's new" tour once
    if (th === 'hero' && g.village) Object.values(g.village.b).forEach(b => { if (b.id === 'castle') b.lv = 4; }); // a finished version 6 castle counts as all 4 stages
    if (th === 'hero') g.castle.rank = rankIndex(crownsOf(P));
    if (th === 'cute' && g.started) { g.egg = g.egg || newEgg(P, 'welcome'); g.eggDay = E.dayKey(); }
    if (th === 'cute') Object.keys(g.actWins || {}).forEach(() => {}); // (nothing to carry over)
  }

}

/* ---------- v7: gear slots ---------- */
const SLOTS = {
  hero: [['w', 'Weapon', 'sword'], ['a', 'Armor', 'shield'], ['c', 'Charm', 'crystal']],
  cute: [['w', 'Hold', 'star'], ['a', 'Wear', 'heart'], ['c', 'Extra', 'sparkle']],
};
// weapons add power, armor adds guard or resists an element, charms are the element/luck/mixed pieces
function slotOf(i) {
  if (i.slot) return i.slot;
  if ((i.el && !i.p) || i.luck) return 'c';
  if (i.p && !i.g && !i.res) return 'w';
  if (!i.p) return 'a';
  return i.p <= 0.1 ? 'a' : 'c';
}
const slotName = k => (SLOTS[G.theme === 'cute' ? 'cute' : 'hero'].find(s => s[0] === k) || [k, k])[1];
function gearList(c) {
  if (!c || !c.eq || !GEAR[G.theme]) return [];
  return ['w', 'a', 'c'].map(k => c.eq[k]).filter(Boolean).map(id => GEAR[G.theme].find(i => i.id === id)).filter(Boolean);
}
// all equipped pieces added together (power capped at +100%, guard at 60%)
function gearStats(c) {
  const out = { p: 0, g: 0, els: new Set(), res: new Set(), luck: false };
  for (const i of gearList(c)) { out.p += i.p || 0; out.g += i.g || 0; if (i.el) out.els.add(i.el); if (i.res) out.res.add(i.res); if (i.luck) out.luck = true; }
  out.p = Math.min(1, out.p); out.g = Math.min(0.6, out.g);
  return out;
}
const wearer = id => G.P.g.roster.find(o => Object.values(o.eq || {}).includes(id)) || null;
function equip(c, item) {
  G.P.g.roster.forEach(o => { if (o.eq) for (const k of Object.keys(o.eq)) if (o.eq[k] === item.id) delete o.eq[k]; });
  c.eq = c.eq || {}; c.eq[slotOf(item)] = item.id;
}
function unequip(c, k) { if (c.eq) delete c.eq[k]; }
function equipPicker(item) {
  return new Promise(res => {
    const g = G.P.g; const k = slotOf(item);
    const pickC = c => { equip(c, item); Sfx.play('good'); Store.save(G.P); ov.remove(); res(); };
    const ov = h('div', { class: 'ov' }, h('div', { class: 'ov-card win' }, h('div', { class: 'ov-big' }, item.em),
      h('div', { class: 'ov-title' }, rw(cute() ? 'Who gets it?' : `Equip the ${item.name} on...`)),
      h('div', { class: 'ov-line slotnote' }, rw(`${slotName(k)} slot`)),
      h('div', { class: 'pick-grid' }, g.roster.map(c => { const cur = c.eq && c.eq[k] ? GEAR[G.theme].find(i => i.id === c.eq[k]) : null;
        return h('button', { class: 'pickc win', onclick: () => pickC(c) }, cSprite(c), h('div', { class: 'ccard-name' }, cName(c)),
          h('div', { class: 'pick-cur' }, cur ? `${cur.em} ${cur.name}` : (cute() ? 'Empty' : `${slotName(k)}: empty`))); })),
      h('button', { class: 'tool ghost', onclick: () => { ov.remove(); res(); } }, rw(cute() ? 'Later' : 'Keep in bag'))));

function heroProblem(P, rng = Math.random) {

      steps: [{ kind: 'deal', total: c, groups: a }, Object.assign(hq(a, 'x', '?', b, `${a} times what makes ${c}? Count by ${a}s until you reach ${c}.`), { form: 'missing', res: c, say: `${a} times what makes ${c}?` })] };

      steps: bh ? [hq(ah, '+', bh, ah + bh, 'Hundreds first.'), hq(a - ah, '+', b - bh, a - ah + b - bh, 'Now the rest.'), hq(ah + bh, '+', a - ah + b - bh, a + b, 'Put them together.')]

  } else if (r < 0.62) { // take away across a hundred: 142 - 67 (count up)
    const a = ri(101, 175), b = ri(Math.max(12, a - 95), 98); const up = Math.ceil(b / 10) * 10; // always crosses 100
    if (up === b || up >= a) pr = { terms: [a, '−', b], ans: a - b, say: `${a} minus ${b}`, steps: [Object.assign(hq(b, '+', '?', a - b, `Count up from ${b} to ${a}. How big is the jump?`), { form: 'missing', res: a, say: `${b} plus what makes ${a}?` })] };

}

/* ---------- v7: battle mechanics (Hamstey Man) ----------
   Each element does something of its own: fire burns, ice can freeze, thunder jumps to a 2nd monster (or shocks a lone one).
   Switching elements makes a combo. Hitting one monster with the same element twice in a row makes it adapt (½ damage)
   until a different element breaks the shield. Bosses charge big attacks: interrupt them or Guard. */
const ADAPT_AFTER = 2;
const COMBOS = { 'fire+ice': { name: 'Steam Blast' }, 'ice+zap': { name: 'Shatter' }, 'fire+zap': { name: 'Overload', splash: 0.4 } };
const comboMul = () => (roomOpen('wizard') ? 1.6 : 1.4);
const roomDmg = () => (roomOpen('war') ? 1.1 : 1);
const roomDef = () => (roomOpen('guard') ? 0.9 : 1);
const roomBig = () => (roomOpen('armory') ? 1.25 : 1);
const elName = el => ELEM[el][cute() ? 'cute' : 'hero'];

function elemMult(f, el) {
  if (cute()) return el === f.weak ? 2 : el === f.resist ? 0.5 : 1;
  if (f.rule === 'lock') return el === f.lockEl ? 2 : 0.4;
  if (f.adapt === el) return 0.5;
  let m = el === f.weak ? 2 : el === f.resist ? 0.5 : 1;
  if (f.shield && f.shield.length) m *= 0.35;
  return m;
}
function elemFx(B, f, el) {
  const fx = { mul: 1, combo: null };
  if (B.lastEl && B.lastEl !== el && B.lastEl in ELEM) {
    fx.combo = COMBOS[[B.lastEl, el].sort().join('+')];
    fx.mul *= fx.combo.name === 'Shatter' && f.frozen ? comboMul() + 0.35 : comboMul();
  }
  if (f.shock) { fx.mul *= 1.25; fx.shocked = true; }
  return fx;
}
const popLater = (el, text, cls, ms) => setTimeout(() => popText(el, text, cls), ms);
// after a hit lands: combos, interrupts, shields, adapting, then the element's own power. Returns extra monsters that got hit.
async function elemAfter(B, f, el, mult, dmg, fx) {
  const extra = []; const foeEl = foeSpr(f); let t = 450; let note = null;
  if (fx.combo) {
    B.combos = (B.combos || 0) + 1; v7s().combos++;
    popLater(foeEl, `${fx.combo.name}!`, 'tagpop combo3', t); t += 250; Sfx.play('star');
    if (fx.combo.name === 'Shatter' && f.frozen) f.frozen = false; // the ice shatters
  }
  if (fx.shocked) f.shock = false;
  if (f.charge && (mult >= 2 || fx.combo)) { f.charge = 0; f.stagger = true; popLater(foeEl, 'Interrupted!', 'tagpop combo2', t); t += 250; }
  if (f.shield && f.shield.includes(el)) {
    f.shield = f.shield.filter(x => x !== el);
    if (!f.shield.length) { f.shield = null; popLater(foeEl, 'Shield broken!', 'tagpop combo2', t); Sfx.play('super'); }
    else popLater(foeEl, `Shield: ${f.shield.length} left`, 'tagpop status', t);
    t += 250;
  }
  if (f.rule !== 'lock') {
    if (f.adapt && f.adapt !== el) { f.adapt = null; popLater(foeEl, 'Guard broken!', 'tagpop combo2', t); t += 250; }
    f.sameN = f.lastHitEl === el ? (f.sameN || 1) + 1 : 1; f.lastHitEl = el;
    if (f.sameN >= ADAPT_AFTER && f.hp > 0 && f.adapt !== el) { f.adapt = el; note = `${f.name} adapted to ${elName(el)}! Switch elements to break it.`; }
  }
  if (f.hp > 0 && el === 'fire') { f.burn = 2; f.burnDmg = Math.max(1, Math.ceil(dmg * 0.2)); popLater(foeEl, `${ic('fire')} Burning`, 'tagpop status fire', t); t += 250; }
  if (f.hp > 0 && el === 'ice' && !f.frozen && (mult >= 2 || Math.random() < (f.boss ? 0.2 : 0.4))) { f.frozen = true; popLater(foeEl, `${ic('ice')} Frozen!`, 'tagpop status ice', t); t += 250; }
  if (el === 'zap') {
    const others = aliveFoes().filter(x => x !== f);
    if (others.length) {
      const o = pick(others); const d2 = Math.max(1, Math.ceil(dmg * 0.5 * (elemMult(o, 'zap') >= 2 ? 1.5 : 1)));
      await wait(250); await projectile(foeEl, foeSpr(o), ELEM.zap.icon);
      o.hp = Math.max(0, o.hp - d2); anim(foeSpr(o), 'hurt', 480); popText(foeSpr(o), String(d2), 'dmg'); popLater(foeSpr(o), 'Chain!', 'tagpop status zap', 150); updateFoe(o); extra.push(o);
    } else if (f.hp > 0) { f.shock = true; popLater(foeEl, `${ic('zap')} Shocked`, 'tagpop status zap', t); t += 250; }
  }
  if (fx.combo && fx.combo.splash) {
    for (const o of aliveFoes().filter(x => x !== f && !extra.includes(x))) {
      const d3 = Math.max(1, Math.ceil(dmg * fx.combo.splash)); o.hp = Math.max(0, o.hp - d3); anim(foeSpr(o), 'hurt', 480); popText(foeSpr(o), String(d3), 'dmg'); updateFoe(o); extra.push(o);
    }
  }
  B.lastEl = el;
  updateFoe(f);
  await wait(Math.min(700, t - 200));
  if (note) {
    setMsg(note); Sfx.play('phase'); updateFoe(f); await wait(1300);
    if (G.B === B) await tipOnce('adapt', { big: ic('shield'), title: 'Monsters adapt!', lines: ['Hit a monster with the same element twice in a row and it gets used to it: that element only does half damage.', 'Hit it with a DIFFERENT element to break its guard. Switching also makes a combo!'] });
  } else if (fx.combo && !tipSeen('combo') && G.B === B) {
    await tipOnce('combo', { big: h('span', { class: 'tri' }, ic('fire'), ic('ice'), ic('zap')), title: `Combo: ${fx.combo.name}!`, lines: ['Attacking with a different element than the last attack makes a combo: extra damage.', 'Steam Blast = fire + ice. Shatter = ice + thunder (huge on a frozen monster). Overload = thunder + fire (splashes the others).'] });
  }
  return extra;
}
// a Finisher (or anything else that breaks a guard): no more adapting, no more charging
function breakGuard(f) {
